# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# RGB LED widget
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# debuging
#CONFIG_ZMK_LOG_LEVEL_DBG=y

# Charge Indicator feature
CONFIG_CHARGE_INDICATOR=y

# LisM 独自のポインタ加速 (速度に応じてカーソル速度を変える)
# MIN_FACTOR = MAX_FACTOR (100=100) の間は加速なし
CONFIG_ZMK_INPUT_PROCESSOR_ACCEL_MIN_FACTOR=100
CONFIG_ZMK_INPUT_PROCESSOR_ACCEL_MAX_FACTOR=100
CONFIG_ZMK_INPUT_PROCESSOR_ACCEL_SPEED_MIN=3
CONFIG_ZMK_INPUT_PROCESSOR_ACCEL_SPEED_MAX=18

# LisM 独自の慣性スクロール (弾いた後もしばらく減速しながらスクロールが続く)
CONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_ENABLED=n
CONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_DECAY_PERCENT=80
CONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_MIN_VELOCITY=1
CONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_START_THRESHOLD=5
CONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_TICK_MS=30
CONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_SMOOTHING=0